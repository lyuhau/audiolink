# Builds every distribution; on a v* tag, publishes them as a GitHub release.
#   audiolink-VER.pyz                 any OS with Python 3.9+ (incl. macOS's /usr/bin/python3), and the Pi
#                                     (`audiolink update`)
#   audiolink-VER-macos-arm64|x86_64.zip  no Python needed: the folder audiolink/ with the
#   audiolink-VER-windows-x64.zip         executable (PyInstaller --onedir; build_bin.py says why)
#   audiolink-pi-VER.zip              the release card (config/pi-release.toml), to unzip onto a
#                                     FAT32 microSD card; audiolink-pi-VER.manifest: its files' sha256
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import audiolink; print(audiolink.__version__)")
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME, but audiolink.__version__ is $V"; exit 1; }
      - run: python3 build_pyz.py
      - name: Package
        run: |
          V=$(python3 -c "import audiolink; print(audiolink.__version__)")
          mkdir -p out
          cp dist/audiolink.pyz "out/audiolink-$V.pyz"
          python3 "out/audiolink-$V.pyz" --version
      - uses: actions/upload-artifact@v5
        with: {name: pyz, path: out/*}

  macos:
    strategy:
      matrix:
        include:
          - {os: macos-latest, arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pyinstaller
      - run: python build_bin.py
      - name: Package and smoke-test (unzipped as a user would, run through a link on PATH)
        run: |
          V=$(python -c "import audiolink; print(audiolink.__version__)")
          mkdir -p out
          Z="out/audiolink-$V-macos-${{ matrix.arch }}.zip"
          cp "dist/audiolink-macos-$(uname -m).zip" "$Z"
          T=$(mktemp -d)
          unzip -q "$Z" -d "$T/apps"
          mkdir "$T/bin" && ln -s "$T/apps/audiolink/audiolink" "$T/bin/audiolink"
          "$T/bin/audiolink" --version
          "$T/bin/audiolink" list-devices
          mkdir "$T/cfg" && echo '{"00": {"alias": "smoke", "name": "smoke"}}' > "$T/cfg/pis.json"
          AUDIOLINK_CONFIG_DIR="$T/cfg" "$T/bin/audiolink" ssh-config --user me | tee "$T/ssh"
          grep -qxF "  ProxyCommand $(cd "$T/apps/audiolink" && pwd -P)/audiolink connect smoke %p" "$T/ssh"
      - uses: actions/upload-artifact@v5
        with: {name: "macos-${{ matrix.arch }}", path: out/*}

  windows:
    runs-on: windows-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pyinstaller
      - run: python build_bin.py
      - name: Package and smoke-test (unzipped as a user would)
        run: |
          V=$(python -c "import audiolink; print(audiolink.__version__)")
          mkdir -p out
          Z="out/audiolink-$V-windows-x64.zip"
          cp dist/audiolink-windows-x64.zip "$Z"
          T=$(mktemp -d)
          python -m zipfile -e "$Z" "$T/apps"
          "$T/apps/audiolink/audiolink.exe" --version
          "$T/apps/audiolink/audiolink.exe" list-devices
          mkdir "$T/cfg" && echo '{"00": {"alias": "smoke", "name": "smoke"}}' > "$T/cfg/pis.json"
          AUDIOLINK_CONFIG_DIR="$(cygpath -w "$T/cfg")" "$T/apps/audiolink/audiolink.exe" ssh-config --user me | tee "$T/ssh"
          grep -qE 'ProxyCommand "?[A-Za-z]:\\.*\\audiolink\\audiolink\.exe"? connect smoke %p' "$T/ssh"
      - uses: actions/upload-artifact@v5
        with: {name: windows-x64, path: out/*}

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {submodules: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: The platform's patched modules (prebuilt, pinned by sha256 in its kernel.env)
        run: platform/alpine-module/fetch.sh
      - name: Build the release card
        run: |
          command -v cpio >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq cpio; }
          tools/build_card.sh config/pi-release.toml
      - name: The packages are the locked ones
        run: git diff --exit-code config/pi-release.packages.lock
      - name: Package
        run: |
          V=$(python3 -c "import audiolink; print(audiolink.__version__)")
          mkdir -p out
          python3 tools/card_zip.py build/card-pi-release "out/audiolink-pi-$V.zip"
          cp build/card-pi-release.manifest "out/audiolink-pi-$V.manifest"
      - uses: actions/upload-artifact@v5
        with: {name: card, path: out/*}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pyz, macos, windows, card]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: {path: out, merge-multiple: true}
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "audiolink $GITHUB_REF_NAME" --generate-notes
