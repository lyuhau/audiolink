# Offline tests (tests/, stdlib unittest; no hardware) and platform/'s pin, on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]          # 24.04: ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}"}
      - run: python3 tools/test.py              # in parallel, one process per module

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install pyflakes && python3 -m pyflakes audiolink tests tools build_pyz.py build_bin.py __main__.py

  # platform/'s pinned pi-gadget-kit commit must be on GitHub (pushed before audiolink),
  # or fresh clones and the release workflow's card can't fetch it. Fails here, loudly.
  platform-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {submodules: true}
      - run: git submodule status
