# audiolink, dev image: pi-release.toml plus the ways in: USB ethernet (the Pi at
# 10.55.0.2, flavors/audiolink.toml's dev function), SSH with keys/id_ed25519.pub, and the
# debug console on.
#   make card                                # then audiolink update build/card-pi
include = "pi-release.toml"

[access]
ssh_public_key = "../keys/id_ed25519.pub" # dev key
debug_console = true                      # USB serial root shell, next to the audio ([device] console)

[device]
dev_functions = true                      # the audiolink flavor's net: USB ethernet
