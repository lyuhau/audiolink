# audiolink, dev image: pi-release.toml plus the ways in: USB ethernet (the Pi at
# 10.55.0.2, device.toml's dev function), SSH with keys/id_ed25519.pub, and the
# debug console on.
#   tools/build_card.sh [config/pi.toml]     # then tools/deploy.sh
include = "pi-release.toml"

[access]
ssh_public_key = "../keys/id_ed25519.pub" # dev key
debug_console = true                      # USB serial root shell, next to the audio ([device] console)

[device]
dev_functions = true                      # device.toml's net: USB ethernet
