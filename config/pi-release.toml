# audiolink, release image: pi.toml without USB ethernet, SSH or the debug console
# (which the card's settings.txt can turn on: console = on).
include = "pi.toml"

[access]
ssh_public_key = ""
debug_console = false

[device]
description = "device-release.toml"
console = true            # room for it in the device; off unless the card says console = on
