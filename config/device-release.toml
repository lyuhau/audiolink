# audiolink's USB device (release): device.toml without the ECM ethernet.
speed = "high-speed"

[device]
idVendor = 0x1d6b   # Linux Foundation
idProduct = 0x0104  # Multifunction Composite Gadget

[strings]
manufacturer = "audiolink"
product = "AudioPi"
serialnumber = "audiopi0001"

[config]
configuration = "AudioPi"
max_power_ma = 250

[[functions]]
kind = "uac2"
id = "audio"
function_name = "AudioPi"
# macOS names the two sound devices after the streaming interfaces' alternate-setting
# strings, "Playback Inactive" and "Capture Inactive". Stock f_uac2 hard-codes those
# (only the platform's patched uac1 takes alt_names), so they stay. audiolink finds the
# devices by the USB ID above (wire/usb_audio.py USB_IDS: add a new ID there), and
# by these names (or, on Windows and Linux, the product) only as a fallback.

[functions.host_to_device]
channels = 2
rates = [48000]
subslot_bytes = 2

[functions.device_to_host]
channels = 2
rates = [48000]
subslot_bytes = 2
